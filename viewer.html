<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio document reader</title><link rel="stylesheet" href="viewer.css"></head><body>
<header><div class="title-row"><h1 id="document-title">Document reader</h1><a id="pdf-link" target="_blank" rel="noopener">Open PDF ↗</a><a id="original-link" download>Download original</a></div><div class="controls" aria-label="Document controls"><button id="previous" aria-label="Previous page">←</button><label>Page <input id="page-number" type="number" min="1" value="1" aria-label="Page number"></label><span id="page-total"></span><button id="next" aria-label="Next page">→</button><span class="separator"></span><button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-level">100%</span><button id="zoom-in" aria-label="Zoom in">+</button><button id="fit">Fit</button><button id="text-toggle" aria-pressed="false">Read text</button></div></header>
<main id="viewport"><div id="page-container"><img id="page-image" alt=""><pre id="page-text" hidden></pre></div><p id="error" hidden></p></main><p id="status" class="sr-only" role="status" aria-live="polite"></p><script src="documents.js"></script><script src="viewer.js"></script></body></html>
